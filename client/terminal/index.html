<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界审计器 · 终端</title>
<style>
  :root{
    --bg:#040604;
    --fg:#33ff77;
    --fg-soft:#9dffc4;
    --dim:#1d8a47;
    --notice:#ffe08a;
    --error:#ff7272;
    --line:#0d2f19;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
    font-size:15px;
    line-height:1.5;
    letter-spacing:.2px;
    overflow-y:scroll;
  }
  #screen{
    padding:18px 22px 96px;
    white-space:pre-wrap;
    word-break:break-word;
    text-shadow:0 0 6px rgba(51,255,119,.18);
  }
  .line{min-height:1.5em}
  .line.banner{color:#eafff2;font-weight:700;letter-spacing:2px}
  .line.dim{color:var(--dim)}
  .line.echo{color:var(--dim)}
  .line.notice{color:var(--notice);text-shadow:0 0 6px rgba(255,224,138,.16)}
  .line.error{color:var(--error);text-shadow:0 0 6px rgba(255,114,114,.16)}
  #bar{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:center;gap:8px;
    padding:10px 22px;
    background:rgba(4,6,4,.96);
    border-top:1px solid var(--line);
  }
  #prompt{color:var(--fg-soft);white-space:pre}
  #cmd{
    flex:1;min-width:0;
    background:transparent;border:0;outline:0;
    color:#d8ffe8;
    font:inherit;
    caret-color:var(--fg);
  }
  #tag{
    color:var(--dim);
    font-size:12px;
    white-space:nowrap;
  }
  #scan{
    position:fixed;inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity:.55;
  }
  @media (max-width:640px){
    body{font-size:13px}
    #screen{padding:12px 14px 92px}
    #bar{padding:8px 14px}
    #tag{display:none}
  }
</style>
</head>
<body>
<div id="screen" aria-live="polite"></div>
<div id="bar">
  <span id="prompt">访客@集市&gt; </span>
  <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false"
         aria-label="终端命令输入" autofocus>
  <span id="tag">只读 · help</span>
</div>
<div id="scan"></div>

<script>
(function () {
  const screen = document.getElementById('screen');
  const input = document.getElementById('cmd');
  const promptEl = document.getElementById('prompt');
  const tagEl = document.getElementById('tag');

  let history = [];
  let cursor = -1;
  let busy = false;
  let booted = false;

  function scrollDown() {
    window.scrollTo(0, document.body.scrollHeight);
  }

  function addLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    screen.appendChild(div);
    scrollDown();
    return div;
  }

  function addBlock(lines, kind) {
    const cls = kind === 'error' ? 'error' : (kind === 'notice' ? 'notice' : 'info');
    (lines || []).forEach(function (line) { addLine(line, cls); });
  }

  function applyMeta(meta) {
    if (!meta) return;
    if (meta.prompt) promptEl.textContent = meta.prompt;
    if (meta.clock) {
      tagEl.textContent = '只读 · ' + meta.clock + ' · help';
    }
  }

  async function send(line, opts) {
    opts = opts || {};
    if (busy) return;
    busy = true;
    if (!opts.silent) addLine(promptEl.textContent + line, 'echo');
    try {
      const resp = await fetch('/api/cmd', {
        method: 'POST',
        headers: {'Content-Type': 'application/json; charset=utf-8'},
        body: JSON.stringify({line: line})
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      addBlock(data.lines, data.kind);
      applyMeta(data.meta);
    } catch (err) {
      addLine('连接失败：' + err.message + '（服务端可能已停止）', 'error');
    } finally {
      busy = false;
      input.focus();
    }
  }

  async function boot() {
    if (booted) return;
    booted = true;
    addLine('世 界 审 计 器 · 经 典 终 端', 'banner');
    addLine('经典 MUD 手感 · 纯文本 · 只读外壳', 'dim');
    try {
      const resp = await fetch('/api/health');
      const data = await resp.json();
      const where = data.run ? data.run.split('/').slice(-1)[0] : 'unknown';
      if (data.ok) {
        addLine('run=' + where + '  第 ' + data.view_day + ' 天结束  ' + data.clock +
                '  events=' + data.events, 'dim');
        const hashText = data.state_hash_match === true ? 'MATCH'
          : (data.state_hash_match === false ? 'MISMATCH' : '未比对（截断回放）');
        addLine('state_hash=' + String(data.state_hash).slice(0, 16) + '…  ' + hashText, 'dim');
        addLine(data.notice, 'notice');
        addLine('输入 help 查看命令；先替你看一眼脚下。', 'dim');
        addLine('', 'info');
        await send('look', {silent: true});
      } else {
        addLine('世界不可用：' + (data.error || '未知错误'), 'error');
        addLine('提示：' + (data.hint || '请用 --run 指向可用的 run 目录。'), 'notice');
        addLine('输入 help 可查看命令说明。', 'dim');
      }
    } catch (err) {
      addLine('连接失败：' + err.message, 'error');
    }
  }

  input.addEventListener('keydown', function (event) {
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === 'Enter') {
      event.preventDefault();
      const line = input.value;
      input.value = '';
      if (!line.trim()) return;
      history.push(line);
      cursor = history.length;
      send(line);
      return;
    }
    if (event.key === 'ArrowUp') {
      event.preventDefault();
      if (!history.length) return;
      cursor = Math.max(0, (cursor < 0 ? history.length : cursor) - 1);
      input.value = history[cursor] || '';
      return;
    }
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      cursor = Math.min(history.length, cursor + 1);
      input.value = history[cursor] || '';
      return;
    }
    if (event.key === 'l' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      screen.innerHTML = '';
      addLine('屏幕已清空（Ctrl+L）。', 'dim');
    }
  });

  document.addEventListener('click', function (event) {
    if (window.getSelection().toString()) return;
    if (event.target !== input) input.focus();
  });

  boot();
})();
</script>
</body>
</html>
