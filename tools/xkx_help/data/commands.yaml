# 命令中文内容表（人工撰写，勿由源码直译）
# 字段：name/layer/aliases/params/summary/system/status/evidence
# status：已实现 / 待实现 / 不做
# system：移动 / 战斗 / 物品 / 社交 / 门派 / 经济 / 系统
# aliases 是本复刻版文字壳使用的中文命令名；xkx 原版使用英文动词。
commands:
  # ---------- cmds/std：常用动作 ----------
  - name: ansuan
    layer: std
    aliases: ["暗算"]
    params: "<人物> at <方向>"
    summary: "对指定方向上的目标暗中下手，命中后造成额外伤害。"
    system: 战斗
    status: 待实现
    blocker: "战斗系统"
    evidence: "基础回合战斗已由 FightAction（src/wsim/actions/combat.py）提供；暗算还缺潜行/先手判定。"
  - name: ask
    layer: std
    aliases: ["问", "打听"]
    params: "<某人> about <话题>"
    summary: "向 NPC 打听或自由提问，按人物设定给出回应。"
    system: 社交
    status: 已实现
    evidence: "TalkAction（src/wsim/actions/social.py）已注册，文字壳已接「问/打听」，可自由交谈；尚无 xkx 话题表。"
  - name: attack
    layer: std
    aliases: ["唆使"]
    params: "<动物>"
    summary: "命令已驯服的动物攻击指定目标。"
    system: 战斗
    status: 不做
    blocker: "宠物/坐骑"
    evidence: "宠物与坐骑实体、驯服度均未建模；本版不开放驯兽与宠物参战。"
  - name: baitan
    layer: std
    aliases: ["摆摊", "出摊"]
    params: "—"
    summary: "在所在位置摆摊，向路过的玩家出售货物。"
    system: 经济
    status: 已实现
    evidence: "OpenShopAction（src/wsim/actions/business.py）支持摊位型店铺；RestockAction/SetPriceAction 管库存与定价。"
  - name: beg
    layer: std
    aliases: ["乞讨"]
    params: "<物品> from <某人>"
    summary: "向他人乞讨物品或钱财。"
    system: 社交
    status: 不做
    blocker: "产品排除/无对应模型"
    evidence: "乞讨会绕过交易与劳动产出，产品上不开放。"
  - name: bugs
    layer: std
    aliases: ["报错"]
    params: "—"
    summary: "向巫师报告游戏错误。"
    system: 系统
    status: 不做
    blocker: "玩家治理/巫师/运营"
    evidence: "本版用仓库 Issue 跟踪缺陷，不提供游戏内报错入口。"
  - name: buy
    layer: std
    aliases: ["买", "购买"]
    params: "<物品> [from <玩家>]"
    summary: "从店铺或玩家处买下物品并支付价款。"
    system: 经济
    status: 已实现
    evidence: "BuyAction（src/wsim/actions/commerce.py）；价格与库存由店铺状态校验。"
  - name: ce
    layer: std
    aliases: ["私语"]
    params: "[kiss|bye] [讯息]"
    summary: "与配偶进行只有两人可见的悄悄话。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "玩家间私聊频道未建模；婚姻系统只记录配偶关系。"
  - name: check
    layer: std
    aliases: ["探察", "打探"]
    params: "[<某人>]"
    summary: "查看某人（或自己）的武功与技能等级。"
    system: 社交
    status: 已实现
    evidence: "session._present_view 与 _skills_detail（src/wsim/api/session.py）给出在场人物技能明细；暂不支持查离线玩家。"
  - name: chi
    layer: std
    aliases: ["吃"]
    params: "<物品>"
    summary: "吃下食物，恢复体力。"
    system: 物品
    status: 已实现
    evidence: "eat 的别名；ConsumeAction（src/wsim/actions/basic.py）结算消耗与体力恢复。"
    canonical: eat
  - name: close
    layer: std
    aliases: ["关门"]
    params: "<门> 或 <方向>"
    summary: "关闭一扇门或某个方向的出入口。"
    system: 物品
    status: 不做
    blocker: "地面物品/容器"
    evidence: "门与容器未建模；本版房间不设可开关门。"
  - name: come
    layer: std
    aliases: ["唤宠"]
    params: "<动物>"
    summary: "让已驯服的动物跟随自己行动。"
    system: 系统
    status: 不做
    blocker: "宠物/坐骑"
    evidence: "宠物与坐骑实体、驯服度均未建模；本版不开放宠物玩法。"
  - name: cuifa
    layer: std
    aliases: ["催发"]
    params: "<人物>"
    summary: "催发三尸脑神丹，控制服丹者。"
    system: 门派
    status: 不做
    blocker: "门派专属"
    evidence: "门派控制类毒药与生死控制未建模，且属于 PK 向玩法，本版不开放。"
  - name: dating
    layer: std
    aliases: ["探察", "打探"]
    params: "[<某人>]"
    summary: "查看某人的武功与技能等级。"
    system: 社交
    status: 已实现
    evidence: "check 的别名；复用 _present_view/_skills_detail（src/wsim/api/session.py）。"
    canonical: check
  - name: demote
    layer: std
    aliases: ["查表情"]
    params: "—"
    summary: "列出某个表情动作的全部变化形式。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "表情系统未建模；文字壳不提供 emote 变体查询。"
  - name: drink
    layer: std
    aliases: ["喝", "饮用"]
    params: "[<饮品>]"
    summary: "喝下饮品，恢复体力或解除部分状态。"
    system: 物品
    status: 已实现
    evidence: "he 的等价命令；ConsumeAction（src/wsim/actions/basic.py）与 UseItemAction（src/wsim/actions/equipment.py）。"
  - name: drop
    layer: std
    aliases: ["丢下", "扔掉"]
    params: "<物品> [all]"
    summary: "把物品放到当前房间的地面上。"
    system: 物品
    status: 不做
    blocker: "地面物品/容器"
    evidence: "地面物品与无主物品模型未建模；V1 明确不做地面掉落。"
  - name: eat
    layer: std
    aliases: ["吃", "进食"]
    params: "<物品>"
    summary: "吃下食物，恢复体力。"
    system: 物品
    status: 已实现
    evidence: "ConsumeAction（src/wsim/actions/basic.py）；食物耗尽后从背包移除。"
  - name: emote
    layer: std
    aliases: ["表情"]
    params: "<动作词>"
    summary: "做一个表情动作，让同房间的人看到。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "玩家间表情广播未建模；本版只保留 NPC 交谈。"
  - name: feed
    layer: std
    aliases: ["喂养"]
    params: "<饲料> to <动物>"
    summary: "用饲料喂养自己的动物。"
    system: 系统
    status: 不做
    blocker: "宠物/坐骑"
    evidence: "宠物与坐骑实体、驯服度均未建模；本版不开放宠物玩法。"
  - name: femote
    layer: std
    aliases: ["找表情"]
    params: "[-s] <关键字>"
    summary: "检索符合关键字的感情动作。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "玩家表情动作与广播未建模；本版不开放表情检索。"
  - name: fight
    layer: std
    aliases: ["切磋", "较量"]
    params: "<人物>"
    summary: "向目标发起切磋（非致命）：按回合结算招式、伤害，受击方气血降到一半即停手，不分生死、不掉落。"
    system: 战斗
    status: 已实现
    evidence: "FightAction（src/wsim/actions/combat.py）已注册；开启 combat.lethal_fight 后是切磋（combat_rules 按 combatd.lpc:683-691 半血停战），仍给 combat_exp/技能进度。要取性命用 kill。"
  - name: follow
    layer: std
    aliases: ["跟随"]
    params: "[<生物>|none]"
    summary: "跟随某个生物行动，或取消跟随。"
    system: 社交
    status: 不做
    blocker: "产品排除/无对应模型"
    evidence: "玩家/NPC 跟随关系未建模，V1 只支持固定房间移动。"
  - name: gamble
    layer: std
    aliases: ["赌博"]
    params: "<大|小> <钱> <种类> <数量>"
    summary: "在赌场押注，按骰子结果结算输赢。"
    system: 经济
    status: 不做
    blocker: "产品排除/无对应模型"
    evidence: "赌博属产品明确排除内容，且会破坏经济模型。"
  - name: get
    layer: std
    aliases: ["拿", "捡"]
    params: "<物品> [from <容器>]"
    summary: "从地面或容器中取走物品。"
    system: 物品
    status: 待实现
    blocker: "战利品系统"
    evidence: "战斗掉落只产出 loot_create 效果（src/wsim/world/effects.py:104 定义、:422 处理），src/wsim/actions/combat.py:124 在战斗结算里发出该效果，但没有 LootAction 消费它；地面物品模型也未建模。"
  - name: give
    layer: std
    aliases: ["给", "赠送"]
    params: "<物品> to <某人>"
    summary: "把物品无偿转交给他人。"
    system: 物品
    status: 待实现
    blocker: "社交系统"
    evidence: "现有 TradeAction 只支持双方对价交易，没有单向转移动作；可复用装备/背包模型后补。"
  - name: go
    layer: std
    aliases: ["走", "前往"]
    params: "<方向>"
    summary: "沿指定方向移动到相邻房间。"
    system: 移动
    status: 已实现
    evidence: "MoveAction（src/wsim/actions/basic.py）；出口校验见 session._location_view。"
  - name: guard
    layer: std
    aliases: ["护卫"]
    params: "[<某人>|<物品>|<出口>|cancel]"
    summary: "为某人、某物或某个出口担任护卫。"
    system: 战斗
    status: 不做
    blocker: "PK/偷抢/对抗"
    evidence: "护卫/拦截玩法依赖战斗与实时对抗，本版不开放。"
  - name: halt
    layer: std
    aliases: ["停手"]
    params: "—"
    summary: "中止当前正在进行的动作。"
    system: 系统
    status: 不做
    blocker: "产品排除/无对应模型"
    evidence: "本版动作按事件原子结算，没有可中断的忙碌状态。"
  - name: han
    layer: std
    aliases: ["喊话", "大喊"]
    params: "<讯息>"
    summary: "向所在区域大喊，让附近的人听到。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "区域广播/频道未建模。"
  - name: hbless
    layer: std
    aliases: ["贺婚"]
    params: "<男名> with <女名>"
    summary: "向新婚夫妇道贺。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "婚礼仪式与广播未建模；婚姻只用 MarriageAction 记录关系。"
  - name: he
    layer: std
    aliases: ["喝"]
    params: "[<饮品>]"
    summary: "喝下饮品，恢复体力。"
    system: 物品
    status: 已实现
    evidence: "drink 的别名；ConsumeAction（src/wsim/actions/basic.py）。"
    canonical: drink
  - name: hit
    layer: std
    aliases: ["出手", "进招"]
    params: "<人物>"
    summary: "对目标发出一击，不做完整战斗结算。"
    system: 战斗
    status: 待实现
    blocker: "战斗系统"
    evidence: "FightAction（src/wsim/actions/combat.py）已有完整回合战斗；hit 需要单次攻击接口，文字壳尚未挂动词。"
  - name: imbibe
    layer: std
    aliases: ["喂饮"]
    params: "<动物>"
    summary: "给动物喂水，维持其饮水与体力。"
    system: 系统
    status: 不做
    blocker: "宠物/坐骑"
    evidence: "宠物与坐骑实体、驯服度均未建模；本版不开放宠物玩法。"
  - name: jiasi
    layer: std
    aliases: ["装死"]
    params: "—"
    summary: "在战斗中假装死亡以脱离战斗。"
    system: 战斗
    status: 不做
    blocker: "PK/偷抢/对抗"
    evidence: "假死/脱离战斗判定未实现，且属玩家对抗向玩法。"
  - name: jiebai
    layer: std
    aliases: ["结拜"]
    params: "<某人>"
    summary: "与另一名玩家结为异姓兄弟或姐妹。"
    system: 社交
    status: 待实现
    blocker: "社交系统"
    evidence: "关系模型已有好感/信任，但没有结拜关系与仪式；可在关系系统上扩展。"
  - name: kantou
    layer: std
    aliases: ["割头"]
    params: "<尸体>"
    summary: "从尸体上割下首级。"
    system: 物品
    status: 不做
    blocker: "地面物品/容器"
    evidence: "尸体与死亡掉落未建模。"
  - name: kill
    layer: std
    aliases: ["杀", "击杀"]
    params: "<人物>"
    summary: "对目标下杀手（致命）：走死亡结算并掉落；与 fight 的切磋不同，fight 到半血会停手，kill 才会打死目标。"
    system: 战斗
    status: 已实现
    evidence: "KillAction（src/wsim/actions/combat.py）在 combat.lethal_fight 打开时注册；文字壳 kill 走 _cmd_attack，目标解析与 fight 相同（_match_fight_target，多命中取第一件）。"
  - name: list
    layer: std
    aliases: ["看货", "货单"]
    params: "[<玩家ID>]"
    summary: "查看当前店铺出售的货物、价格与库存。"
    system: 经济
    status: 已实现
    evidence: "房间 services_detail 与店铺只读视图（src/wsim/api/session.py）已提供货物、价格、库存。"
  - name: locate
    layer: std
    aliases: ["找物"]
    params: "<物品>"
    summary: "在任务中定位指定任务物品所在的房间。"
    system: 系统
    status: 待实现
    blocker: "任务系统"
    evidence: "任务系统只有委托接取/交付，没有任务物品坐标与定位索引。"
  - name: location
    layer: std
    aliases: ["寻人"]
    params: "<玩家ID>"
    summary: "查看某个在线玩家当前所在的位置。"
    system: 系统
    status: 已实现
    evidence: "src/wsim/api/session.py 的 _online_players_view 提供 location 字段；本版对所有玩家开放，不设门派技能门槛。"
  - name: look
    layer: std
    aliases: ["看", "观察"]
    params: "[<物品>|<生物>|<方向>]"
    summary: "查看房间、人物、物品或某个方向的描述。"
    system: 系统
    status: 已实现
    evidence: "session._location_view（src/wsim/api/session.py）返回房间描述、出口、NPC 与店铺。"
  - name: mbless
    layer: std
    aliases: ["月老贺婚"]
    params: "<男名> with <女名>"
    summary: "以月老身份向新婚夫妇道贺。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "婚礼仪式与广播未建模。"
  - name: open
    layer: std
    aliases: ["开门"]
    params: "<门> 或 <方向>"
    summary: "打开一扇门或某个方向的出入口。"
    system: 物品
    status: 不做
    blocker: "地面物品/容器"
    evidence: "门、容器与开关状态均未建模；本版房间不设可开关门。"
  - name: piao
    layer: std
    aliases: ["嫖"]
    params: "<某人>"
    summary: "在青楼消费寻欢。本版此类场所不开放。"
    system: 社交
    status: 不做
    blocker: "产品排除/无对应模型"
    evidence: "青楼与相关消费场景未建模，且属产品明确排除内容。"
  - name: pour
    layer: std
    aliases: ["倒药"]
    params: "<药物> in <容器>"
    summary: "把药物倒入容器中调制。"
    system: 物品
    status: 不做
    blocker: "地面物品/容器"
    evidence: "容器与药物调制未建模。"
  - name: put
    layer: std
    aliases: ["放入"]
    params: "<物品> in <容器>"
    summary: "把物品放进容器。"
    system: 物品
    status: 不做
    blocker: "地面物品/容器"
    evidence: "容器、容量与放入/取出关系未建模；本版背包为扁平列表。"
  - name: qiecuo
    layer: std
    aliases: ["求教绝招"]
    params: "<基本功>[.<绝招>]"
    summary: "通过与指定对手切磋，验证并解锁某项绝招。"
    system: 门派
    status: 待实现
    blocker: "武学/资源系统"
    evidence: "依赖绝招/perform 系统；技能目前只有 0..1 熟练度，没有招式位。"
  - name: qixing
    layer: std
    aliases: ["布阵", "北斗阵"]
    params: "<敌手> <阵友1>…<阵友6>"
    summary: "布下天罡北斗阵与敌手对抗。"
    system: 门派
    status: 不做
    blocker: "门派专属"
    evidence: "多人阵法与全真门派专属玩法未建模，V1 不开放。"
  - name: release
    layer: std
    aliases: ["放生"]
    params: "—"
    summary: "放走自己的动物。"
    system: 系统
    status: 不做
    blocker: "宠物/坐骑"
    evidence: "宠物与坐骑实体、驯服度均未建模；本版不开放宠物玩法。"
  - name: remove
    layer: std
    aliases: ["脱下", "卸甲"]
    params: "all | <物品>"
    summary: "脱下身上穿戴的防具。"
    system: 物品
    status: 已实现
    evidence: "UnequipAction（src/wsim/actions/equipment.py）；`remove all` 可一次卸下全部防具。"
  - name: reply
    layer: std
    aliases: ["回话"]
    params: "<讯息>"
    summary: "回复最近一次私聊。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "玩家私聊频道未建模。"
  - name: ride
    layer: std
    aliases: ["骑乘"]
    params: "<生物>"
    summary: "骑上马匹或其他坐骑。"
    system: 系统
    status: 不做
    blocker: "宠物/坐骑"
    evidence: "坐骑与骑行移动未建模。"
  - name: say
    layer: std
    aliases: ["说话"]
    params: "<讯息>"
    summary: "在当前房间说话，同房间的人可见。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "玩家间房间广播未建模；V1 只支持与 NPC 的 TalkAction。"
  - name: semote
    layer: std
    aliases: ["查动作"]
    params: "[词首]"
    summary: "按词首列出可用的感情动作。"
    system: 社交
    status: 不做
    blocker: "玩家频道/社交广播"
    evidence: "玩家表情动作与广播未建模；本版不开放表情检索。"
  - name: setwmsg
    layer: std
    aliases: ["定兵描"]
    params: "-w|-u <描述>"
    summary: "设置自制兵器在战斗中的描述文字。"
    system: 物品
    status: 不做
    blocker: "产品排除/无对应模型"
    evidence: "自制兵器与战斗描述未建模。"
  - name: shexin
