# W3 物品档案：产地、用途、价格锚点与委托模板引用。
# 价格锚点必须是同类品，新价与锚点价偏差 <= 20%（既有人工物价模型的护栏）。
# quest_refs 必须真实出现在对应模板的 target_item 或 intent_args 货品字段里。
