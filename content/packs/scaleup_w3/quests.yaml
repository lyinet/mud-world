# W3 新增 33 张委托模板，覆盖 8 类：送货 / 打听 / 护送 / 代购 / 清障 / 教习 / 代工 / 讨债。
# 每条都有前置可满足路径、时限（>=2 日）与报酬；单笔现金 <= 2×最高日薪，折日 <= 最高日薪。
# 新增类别 clear_path / teaching 都由既有 work 动词承载（清障=清理搬运，教习=代课授艺）。
quests:
