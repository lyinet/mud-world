    target_item: bean_curd
    verb: trade
    intent_args:
      target: cang_mishu
      offer: []
      want: []
      money_delta: 0
    deadline_days: 2
    reward: {money: 9, relation: 2}
    notes: "罗斗把豆制品摊的出入账捎回粮仓；豆腐是本单随货清点的凭证。"

