topics:
  - id: intro
    title: 「侠客行一百」简介
    category: 入门
    status: 部分开放
    body: |
      这里是一个以金庸江湖为底本的中文武侠世界。你从一名初入江湖的普通人开始，
      靠走动、交谈、做工、经商与练武逐步站稳脚跟。
      本复刻版沿用事件驱动的世界引擎：时间会随心跳推进，NPC 会自己安排生计，
      店铺有库存与价格，委托会过期，门派有弟子与账目。
      当前开放的是杭州—嘉兴—石梁一带的起始区域，其余地图按内容包进度逐步开放。
      想看自己状态，输入「状态」；想认路，输入「地图」；想学怎么玩，输入「帮助 新手指南」。
  - id: newbie
    title: 「侠客行一百」新手指南
    category: 入门
    status: 开放
    body: |
      初入江湖，先做三件事：看清所在房间，确认身上有什么，弄明白自己能去哪。
      常用命令：看、走 <方向>、背包、状态、看货、买 <物品>、地图。
      体力是行动的本钱，做工、赶路与战斗都会消耗；体力见底时先离开危险处，
      回到安全地点，别硬撑着继续赶路或做工。
      钱财分文与两，买卖时看清单价与总价；钱不够就先做工或接委托。
      与人交谈用「交谈 <人物> <内容>」，目前只能与在场 NPC 对话。
      遇到不会的，输入「帮助」看主题目录，或「帮助 命令」查命令分类。
      本版不开放玩家间私聊、组队、偷抢与 PK，先把单人江湖走稳。
  - id: rules
    title: 玩家规则篇
    category: 规则
    status: 开放
    body: |
      一、一人一号，禁止多开刷资源、刷委托奖励或利用脚本同时操作多个角色。
      二、禁止利用漏洞复制物品、刷钱、改价或绕过门派贡献校验；发现漏洞请走仓库 Issue。
      三、本版不开放 PK、偷窃、赌博、青楼与角色自杀；相关命令均标记为「不做」。
      四、禁止在公共频道刷屏、冒充管理员或骗取他人财物；本版暂未开放玩家间交易频道。
      五、违规处理以冻结角色、回滚异常收益为主；严重者停用账号。
      规则以本页为准，运营公告与本页冲突时，以最新公告为准。
  - id: setup
    title: 环境变量设置篇
    category: 设置
    status: 未开放
    body: |
      原版用「设置」与「取消设置」调整 brief、combat、color 等显示选项。
      本复刻版的显示由前端文字壳统一控制，服务端没有玩家级设置表，
      因此「设置」「取消设置」暂未接入；当前默认值已经按中文阅读习惯调好。
      需要调整字号、配色或滚动速度时，请在文字壳界面操作，不要依赖游戏内变量。
      后续若要开放玩家级设置，会把设置项纳入玩家档案并做服务端校验。
  - id: wiz-rules
    title: 巫师规则篇
    category: 管理
    status: 管理
    body: |
      本页面向管理员，不向普通玩家开放具体操作。
      管理员不得直接修改玩家角色数值、钱包或门派账目；需要修正时，
      应通过事件流补发可审计的系统事件，保留前后值。
      禁止用管理员权限参与玩家经济、帮助特定玩家争夺资源或泄露未公开内容。
      所有内容包变更走仓库提交与评审，不在线上直接改文件。
  - id: wiz-setup
    title: 巫师环境变量设置篇
    category: 管理
    status: 管理
    body: |
      管理端的显示与调试开关由服务端配置决定，不在游戏内提供巫师变量表。
      需要临时调整日志级别、地图可见性或经济参数时，走配置变更流程并记录原因。
      普通玩家看不到本页；若你以玩家身份读到本页，说明权限配置有误，请联系管理员。
  - id: gift-char
    title: 天赋篇
    category: 角色
    status: 未开放
    body: |
      原版建号时掷出膂力、悟性、根骨、身法、耐力、灵性、福缘、容貌、定力、胆识等天赋，
      天赋影响练武速度、学艺上限与部分剧情判定。
      本复刻版当前用「游侠」「商人」「捕快」等出身决定初始钱包、技能与门派倾向，
      还没有独立的十项天赋字段。战斗系统接入时会一并设计属性与成长上限，
      届时会给出可重掷或可分配的建号流程，避免出现原版反复删号刷天赋的问题。
  - id: user-level
    title: 进阶篇
    category: 角色
    status: 部分开放
    body: |
      角色成长分三条线：技能熟练度、门派身份与江湖声望。
      技能熟练度现在用 0 到 1 的数值表示，界面会换算成 1 到 10 级；
      投入小时越长越接近精通，可用「练习」「练功」推进，用「技能」查看明细。
      门派身份从入门弟子到掌门，靠贡献、收徒与门派账目积累；
      玩家自创门派可以收徒、逐徒、发放月钱与存取公款。
      声望与称号尚未接入；等委托、门派与战斗产出稳定后再开放，
      避免出现只靠刷单一动作就能涨声望的漏洞。
  - id: cmds
    title: 命令篇
    category: 系统
    status: 开放
    body: |
      命令按用途分七类：移动、战斗、物品、社交、门派、经济、系统。
      每个命令都有英文原名与中文别名；本版文字壳优先接受中文别名。
      查命令用「帮助 命令」，再按分类看具体条目；例如「帮助 移动」看走路与地图，
      「帮助 物品」看背包、穿戴与吃喝，「帮助 经济」看买卖、摆摊与店铺。
      带参数的命令会在帮助里写明参数；不确定时先不带参数执行，通常会给出用法提示。
      本版明确不做的命令也会在覆盖矩阵里标出理由，避免玩家反复尝试。
  - id: map
    title: 地图篇
    category: 系统
    status: 开放
    body: |
      世界由房间节点和带方向的出口组成。用「看」看当前房间的出口，
      用「走 <方向>」移动到相邻房间，用「地图」查看已开放区域的全图与邻接关系。
      地图接口只返回公共节点与真实邻接边，不泄露隐藏房间或任务坐标。
      当前起始区域是杭州、嘉兴与石梁一带；跨区域长途路线会随内容包扩充。
      若某方向走不通，多半是出口未开放或需要特定身份，不是命令写错。
  - id: relation
    title: 交流篇
    category: 社交
    status: 部分开放
    body: |
      与 NPC 交谈用「交谈 <人物> <内容>」，系统会按人物性格、身份与关系给出回应。
      打听话题、玩家间说话、私聊、喊话、耳语、组队与表情动作暂未开放，
      相关命令在覆盖矩阵里标为「不做」或「待实现」，避免误解为功能故障。
      婚姻关系已经可以建立：求婚、答应、拒绝、解除与夫妻交流都有对应动作；
      婚礼仪式、结拜与师徒授课仍在规划。
  - id: transport
    title: 交通篇
    category: 移动
    status: 部分开放
    body: |
      目前只有步行：用「走 <方向>」在相邻房间之间移动。
      原版的骑马、坐车、坐船与门派传送尚未建模；
      「骑乘」「下骑」等命令暂不开放。
      长途移动会消耗体力，出发前先看「状态」，体力见底时回安全地点休整。
      地图上的连线代表真实可行走的出口，不包含车船航线。
  - id: family
    title: 门派篇
    category: 门派
    status: 部分开放
    body: |
      门派是角色身份的核心：决定可学武学、师承关系、门派任务与贡献。
      本版支持加入既有门派，也支持玩家自创门派。
      自创门派后可以收徒、逐徒、发放弟子月钱、存入与支取门派公款；
      相关命令：收徒、逐徒、门派存入、门派支取、门派账目。
      拜师与师父授课链路尚未对玩家开放：引擎里有拜师动作，
      但玩家动词白名单暂时拦住，等师承与技能树设计定稿后再放行。
      门派贡献、职位晋升与门派战争仍是后续里程碑。
  - id: party
    title: 帮会篇
    category: 门派
    status: 未开放
    body: |
      原版的帮会是与门派不同的玩家组织，可跨门派拉人、设堂口、打帮战。
      本复刻版当前只有门派与玩家自创门派，没有独立帮会模型，
      因此帮会创建、帮战、堂口与帮会仓库均不开放。
      若后续要做，需要先解决玩家组织权限、共同财产与离线成员管理，
      否则很容易出现帮会仓库被单人掏空的问题。
  - id: skill
    title: 武技篇
    category: 门派
    status: 部分开放
    body: |
      武技分为内功、轻功、招式与知识四类；原版还有激发、准备、绝招与自创武功。
      本版先把技能做成带名称与熟练度的扁平结构，界面按 1 到 10 级显示，
      可用「技能」查看，用「练习」「练功」推进熟练度。
      内功、内力、精与气尚未建模，所以「打坐」「吐纳」「加力」「运功」暂不开放；
      招式位、绝招与自创武功也还没有，相关命令标为「待实现」或「不做」。
      等战斗系统接入后，会先做技能种类、激发槽与招式位，再做绝招。
  - id: weapon
    title: 兵器篇
    category: 战斗
    status: 部分开放
    body: |
      装备分武器与防具槽：用「持兵器」把武器拿在手里，用「穿上」穿防具，
      用「收兵器」或「脱下」卸下，用「背包」查看当前装备与物品。
      装备会校验槽位、等级与身份限制；不满足条件时动作会被拒绝并给出原因。
      原版的兵器耐久、淬毒、自制兵器描述与战斗招式尚未建模，
      相关命令「定兵描」等暂不开放。
      战斗系统接入后，武器伤害、防具减伤与招式加成会一起进入结算。
  - id: mission
    title: 任务篇
    category: 任务
    status: 开放
    body: |
      委托分发布、接取、执行与交付四步。
      用「任务榜」查看当前可接委托，用「任务」查看自己已接的委托与进度。
      接取与交付由服务端按委托条件校验，不能跳过路线或重复领奖。
      原版有上千条固定任务与任务物品定位；本版先用可配置委托板，
      「找物」这类任务物品定位命令暂未开放。
      委托过期会失败并释放名额，接之前先确认自己的体力与路线。
  - id: contest
    title: 比武篇
    category: 战斗
    status: 未开放
    body: |
      原版有玩家比武、擂台与生死斗。本复刻版明确不做 PK 与玩家对抗，
      因此比武、偷袭、投降、劝架等对抗向命令均不开放。
      战斗系统会先用于玩家对 NPC 的副本式遭遇，保证数值与掉落可控；
      等战斗稳定后，再评估是否开放非致命的切磋场地。
      在此之前，任何声称能与其他玩家开战的入口都不是本版功能。
  - id: trade
    title: 行商篇
    category: 经济
    status: 部分开放
    body: |
      经济闭环包括：做工或委托赚钱、在店铺买货、把货物卖给店铺、
      与玩家对价交易、摆摊或开店经营。
      常用命令：买、卖、交易、摆摊、看货、查价、补货、定价、提现、店铺账目。
      店铺有启动费、库存、资金与税率；经营不善会亏损，不能无限赊账。
      原版的当铺、拍卖、赌场与青楼消费不开放；赌博与偷抢会破坏经济，明确不做。
      玩家间单向赠送尚未开放，交易必须双方确认对价。
  - id: city
    title: 城市篇
    category: 经济
    status: 部分开放
    body: |
      城市提供店铺、客栈、门派驻地与委托板。
      用「看」确认当前房间有哪些店铺与服务，用「看货」看货物与价格，
      用「走」沿出口在城市内移动，用「地图」看整体布局。
      当前开放杭州、嘉兴与石梁的起始片区；衙门、钱庄、赌场等设施按内容包逐步加入。
      城市服务由 NPC 经营，缺货、涨价与关门都会随世界时间变化，
      不是固定的菜单。
  - id: house
    title: 家庭篇
    category: 经济
    status: 部分开放
    body: |
      婚姻关系已经可用：求婚、答应、拒绝、解除与夫妻交流都有对应动作。
      原版的买房、置地、家庭成员、子女与遗产尚未建模，
      因此购房、搬家、生育与家庭仓库不开放。
      结婚前请确认双方在线且关系满足条件；婚姻状态可以在「状态」里查看。
      房屋系统需要独立的产权、租金与离线结算，等经济模型稳定后再做。
  - id: cookery
    title: 烹饪篇
    category: 经济
    status: 未开放
    body: |
      原版可以采集食材、下厨、设宴，食物还能影响体力与关系。
      本复刻版暂未建模食材、菜谱与烹饪设施；
      现有的「吃」「喝」只消耗成品食物与饮品，不能现场烹饪。
      等物品分类与消耗效果扩充后，再开放采集、菜谱与宴席。
  - id: medical
    title: 丹药篇
    category: 生活
    status: 部分开放
    body: |
      药物目前作为消耗品存在：用「吃」「喝」或「使用」消耗，
      按物品效果恢复体力或解除简单状态。
      原版的诊脉、配药、炼丹、毒伤与内伤分类尚未建模；
      疗伤、解毒与炼丹相关命令暂不开放。
      战斗系统接入后会先做伤势与药物效果表，再谈炼丹。
  - id: pet
    title: 宠物篇
    category: 生活
    status: 未开放
    body: |
      原版可以驯服动物、喂养、骑乘并让宠物参战。
      本复刻版没有宠物实体、驯服度与跟随状态，
      因此「唤宠」「留宠」「止宠」「驯兽」「喂养」「放生」等命令全部不开放。
      宠物会引入额外战斗单位与离线行为，需要单独的 AI 与存档模型，
      不在当前单人江湖切片内。
  - id: wuguan
    title: 武馆篇
    category: 门派
    status: 未开放
    body: |
      原版武馆提供付费学艺、踢馆与忠诚度。
      本复刻版用门派与师父授课来承担武学传承，没有独立武馆模型；
      因此武馆报名、踢馆与武馆声望不开放。
      想提升技能，先用「练习」「练功」；师承链路开放后再走拜师与授课。
  - id: calamity
    title: 浩劫篇
    category: 生活
    status: 未开放
    body: |
      原版会周期性触发全服浩劫，影响物价、门派与地图安全。
      本复刻版的世界时间只推进生产、委托与店铺结算，
      还没有全服灾难、封锁与重建机制。
      浩劫需要可回滚的世界状态与公告链路，等运营工具成熟后再评估。
  - id: book
    title: 书籍篇
    category: 生活
    status: 未开放
    body: |
      原版可以买书、读书、抄书，书籍能提升知识技能甚至触发剧情。
      本复刻版没有书籍物品与阅读进度，因此「读书」暂不开放。
      技能提升目前只走「练习」「练功」；等物品分类支持书籍后，
      会补阅读耗时、知识上限与残页收集。
  - id: bug
    title: 臭虫篇
    category: 系统
    status: 未开放
    body: |
      本版不提供游戏内报错命令。发现穿模、数值异常、委托卡死或物品复制，
      请记录角色名、时间、所在房间、执行命令与预期结果，提交到仓库 Issue。
      能用「状态」「背包」「地图」复现的信息请一并附上。
      不要利用漏洞反复刷取收益；异常收益会被回滚。
  - id: game
    title: 附属游戏
    category: 生活
    status: 未开放
    body: |
      原版包含赌博、猜谜、棋局等小游戏。
      本复刻版明确不做赌博类玩法，其他小游戏也尚未建模。
      当前可玩的闭环是走图、交谈、做工、买卖、经营、委托与练武。
      后续若加小游戏，会优先选择不产出钱财、不影响排名的纯娱乐玩法。
  - id: event
    title: 自然奇观篇
    category: 生活
    status: 未开放
    body: |
      原版会按节气与天气触发自然奇观、特殊采集与临时事件。
      本复刻版只有世界 tick，没有天气、节气与地图事件表；
      因此奇观、天象与临时采集点不开放。
      世界时间仍会影响店铺结算与委托过期，玩家可以在「时间」查看当前 tick。
  - id: hslj
    title: 华山论剑篇
    category: 门派
    status: 未开放
    body: |
      华山论剑是原版的周期性高手排名赛。
      本复刻版不做玩家对抗，也没有赛季、排名与观战系统，
      因此华山论剑、报名、擂台与称号奖励不开放。
      门派内部的成长与委托仍可正常进行；等非致命切磋方案成熟后再评估赛事。
  - id: creates
    title: 自创武功篇
    category: 门派
    status: 未开放
    body: |
      原版高手可以自创武功、命名招式并传给弟子。
      本复刻版技能结构是扁平的名称加熟练度，没有招式位、技能树与传承模型；
      因此自创武功、自练、研究与融功均不开放。
      自创武功会直接影响平衡与门派生态，需要先做完技能种类、招式位与战斗结算，
      再单独设计创作成本与审核流程。
