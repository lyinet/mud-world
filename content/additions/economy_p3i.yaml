# P3I 内容扩展（economy）：物品产地/用途目录 + 确定性供需物价模型。
#
# 重要边界：P1/P3 引擎的 `Content.item_price()` 只读取 items.yaml 的 base_price
# 与 economy.price_markup，不读取本文件的 price_model；因此本文件里的价格曲线
# 是“内容层规格 + 可复现校验”，不会改变运行中的买卖价。详见
# docs/CONTENT-GUIDE-p3i.md 的“物价波动”一节（如实标注为引擎未接入）。
#
# 设计约束：不引入随机数/噪声项。价格只由 (base_price, supply_by_day,
# demand_by_day, elasticity) 四个确定性输入算出，同一输入任意次计算同结果。

item_catalog:
  rice_cake:
    origin: inn
    usage: "客栈早点；饥饿 NPC 在客栈买入充饥"
  lotus_root:
    origin: ferry
    usage: "河渡水产；可充饥，也可作素菜原料"
  river_fish:
    origin: ferry
    usage: "河渡水产；客栈与渔民日常食材"
  millet:
    origin: market
    usage: "集市主粮；客栈采购委托 daily_inn_millet 的目标物"
  hemp_rope:
    origin: market
    usage: "捆货与渔网修补；新手采购链 tutorial_03/04 的垫付商品"
  bamboo_basket:
    origin: market
    usage: "挑担与装货容器；货郎偏好采购"
  ink_stick:
    origin: academy
    usage: "书院抄书耗材；书生模拟会买入"
  sickle:
    origin: smithy
    usage: "农具；铁匠铺新货，秋收前需求上升"
  moxa_roll:
    origin: pharmacy
    usage: "灸疗耗材；药铺购入，新手链 3/4 步的关键商品"
  pearl_earring:
    origin: market
    usage: "门面首饰；高净值 NPC 送礼与嫁娶用"

# 三条跨多日长线目标编排。它们不新增 goal 记录（NPC 的 goals 已是引擎认的 3 条上限），
# 而是把现有 goal 组合成“玩家可追”的弧线，并给出可观测的里程碑阈值。
# 玩家在 NPC 详情里看到的是 goal 进度百分比；里程碑阈值按 progress 0-1 计算。
# 引擎不产生独立 milestone 事件，阈值由校验器/复盘脚本按进度日志比对（见文档）。
long_term_arcs:
  - id: arc_liu_embroidery
    title: "柳三娘的绣庄（盘铺子）"
    npc: liu_sanniang
    goal: goal_liu_sanniang_1
    goal_type: build_shop
    days: "1-8"
    milestones:
      - {at: 0.25, label: "攒够门面钱"}
      - {at: 0.60, label: "定下铺面"}
      - {at: 1.00, label: "绣庄开张"}
    observe: "NPC 详情 build_shop 进度跳到 100%；open_shop 事件后她的摊子变成铺子"
  - id: arc_duan_stall
    title: "段五斗的菜摊盘成铺子"
    npc: duan_wudou
    goal: goal_duan_wudou_2
    goal_type: build_shop
    days: "1-8"
    milestones:
      - {at: 0.25, label: "攒够盘铺钱"}
      - {at: 0.60, label: "定下摊前铺面"}
      - {at: 1.00, label: "菜铺开张"}
    observe: "NPC 详情 build_shop 进度跳到 100%；open_shop 事件后菜摊转为铺子"
  - id: arc_han_apprentice
    title: "韩杏林学手艺（拜师学徒）"
    npc: han_xinglin
    goal: goal_han_xinglin_1
    goal_type: advance_skill
    days: "2-10"
    milestones:
      - {at: 0.03, label: "认全药材"}
      - {at: 0.15, label: "能独立抓方"}
      - {at: 0.40, label: "考校通过"}
    observe: "NPC 详情 advance_skill 进度；cultivate/apprentice 事件提升 mastery，talk 台词随进度变化"

price_model:
  version: "p3i-1"
  deterministic: true
  # 只用四则运算与四舍五入，不出现 random / rng / noise 字段。
  formula: "price = round(base_price * (1 + elasticity * (demand - supply) / (demand + supply)))"
  horizon_days: 2
  categories:
    food:
      elasticity: 0.30
      items: [rice, flatbread, millet]
      supply_by_day: [120, 90]
      demand_by_day: [100, 140]
      driver: "集市进货量与饭口需求：第 2 日进货收紧、赶集人增多"
    material:
      elasticity: 0.25
      items: [hemp_rope, bamboo_basket, iron_ingot]
      supply_by_day: [60, 45]
      demand_by_day: [50, 70]
      driver: "船坞换绳与秋收备货同时挤占麻绳、竹器与铁料"
    tool:
      elasticity: 0.20
      items: [sickle, hammer, cleaver]
      supply_by_day: [30, 30]
      demand_by_day: [25, 40]
      driver: "秋收前农具需求上升，铁匠铺供给短期不变"
    medicine:
      elasticity: 0.35
      items: [moxa_roll, mugwort, wound_powder]
      supply_by_day: [40, 32]
      demand_by_day: [35, 48]
      driver: "换季灸疗与跌打需求上升，药铺库存消耗快"
    luxury:
      elasticity: 0.15
      items: [pearl_earring, silk, jade_pendant]
      supply_by_day: [8, 8]
      demand_by_day: [6, 10]
      driver: "嫁娶与节礼集中在第 2 日，奢侈品需求抬升"
