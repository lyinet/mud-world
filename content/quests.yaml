  - id: errand_market_ledger
    name: 捎账本到客栈
    category: errand
    repeatable: true
    starter: true
    entry_cost: 0
    giver: jin_mancang
    target_npc: song_henian
    target_location: inn
    verb: trade
    intent_args:
      target: song_henian
      offer: []
      want: []
      money_delta: 0
    deadline_days: 2
    reward: {money: 10, relation: 2}
    notes: "金满仓把本月米账誊好，让跑腿的送到客栈宋鹤年手里；market 到 inn 只隔一条街，不用垫钱。"
  - id: errand_market_sweet
    name: 捎一包喜糖到书院
    category: errand
    repeatable: true
    starter: true
    entry_cost: 0
