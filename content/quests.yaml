  # ------------------------------------------------------------------
  # P3I 新手引导链（4 步）：认识第一位 NPC → 送样 → 首单采购 → 第一笔卖货。
  # 触发条件（引擎逐项检查）：发布人活着且现金足够、玩家未接同类任务、
  # 玩家金币 ≥ entry_cost、当前地点为发布人所在地；后一步在收益与垫付上
  # 自然要求先完成前一步（内容层软引导，非引擎强制前置）。
  # ------------------------------------------------------------------
  - id: tutorial_meet_sanniang
    name: "【引导1/4】到集市绣摊认识柳三娘"
    category: errand
    repeatable: true
    starter: true
    entry_cost: 0
    giver: jin_mancang
    target_npc: liu_sanniang
    target_location: market
    verb: trade
    intent_args:
      target: liu_sanniang
      offer: []
      want: []
      money_delta: 0
    deadline_days: 2
    reward: {money: 10, relation: 3}
    notes: "金满仓让你先去绣摊跟柳三娘打个照面，报上他的名字即可；这一单不用垫钱。"
  - id: tutorial_silk_sample
    name: "【引导2/4】把绣样送到药铺苏掌柜手上"
    category: errand
    repeatable: true
    giver: liu_sanniang
    target_npc: su_hexiang
    target_location: pharmacy
    verb: trade
    intent_args:
      target: su_hexiang
      offer: []
      want: []
      money_delta: 0
    deadline_days: 2
    reward: {money: 12, relation: 3}
    notes: "柳三娘把绣样交给你，让你送到药铺给苏合香做药囊衬里，当面交接即可。"
  - id: tutorial_first_buy
    name: "【引导3/4】首单采购：垫付28文买两束艾条"
    category: procurement
    repeatable: true
    giver: su_hexiang
    target_npc: su_hexiang
    target_location: pharmacy
    target_item: moxa_roll
    verb: buy
    intent_args: {item: moxa_roll, qty: 2, from: pharmacy}
    entry_cost: 28
    deadline_days: 2
    reward: {money: 14, relation: 3}
    notes: "苏合香让你先垫 28 文买两束艾条回来，交付一束，剩下一束留作下一步卖货用。"
  - id: tutorial_first_sale
    name: "【引导4/4】第一笔卖货：把艾条卖给曹半仙"
    category: errand
    repeatable: true
    giver: cao_banxian
    target_npc: cao_banxian
    target_location: temple
    verb: trade
    intent_args:
