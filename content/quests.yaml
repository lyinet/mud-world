      want: []
      money_delta: 8
    deadline_days: 2
    reward: {money: 14, relation: 3}
    notes: "城隍庙的曹半仙常备艾条替人灸治；把采购剩下的那束卖给他，收 8 文，完成第一笔卖货。"

  # ------------------------------------------------------------------
  # P3I 日常委托（8 条，全部 repeatable=True）：引擎每日开市时统一刷新，
  # 同一模板同一时刻只保留一张 open/accepted 单；发布人现金不足、历史完成率
  # < 0.2、或过期单达到上限时自动停发。难度分层由 name 前缀与报酬/时限给出：
  # 【轻】8-12 文 / 2 日；【中】14-18 文 / 2 日；【重】22 文 / 3 日。
  # ------------------------------------------------------------------
  - id: daily_ferry_message
    name: "【轻】捎口信到客栈"
