# 经济参数。单位统一为「文」，1 两银 ≈ 1000 文（仅作换算参考，P1 不用银两）。
# 本文件同时承担「闭环约束」：引擎应按 money_supply / payroll_rules 实现，不得凭空造钱。
currency:
  name: 文
  silver_liang_in_wen: 1000

money_supply:
  initial_npc_total: 35650
  initial_location_float_total: 11500
  location_float:
    market: 3000
    smithy: 1200
    inn: 1800
    escort_agency: 1500
    pharmacy: 2000
    academy: 800
    ferry: 500
    temple: 700
  sources: []
  sinks: [income_tax, transaction_tax, shop_monthly_tax]
  conservation: "任何付款方余额不足时记欠账或拒绝交易，禁止引擎直接增发余额；税收进入官仓后不再回流。"

