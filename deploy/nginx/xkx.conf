# XKX 反向代理（TLS 终止）。挂载为 /etc/nginx/conf.d/default.conf。
#
# 选 nginx 而不是 caddy 的原因：
#   1) 需要把请求体上限严格对齐后端（8KB）并单独放行探活路径，nginx 的
#      client_max_body_size / location 语义最直接；
#   2) 证书可来自自有 CA/运维统一签发，不必依赖 ACME 域名校验；
#   3) 生产常见、排障资料多，配置可被 nginx -t 静态校验。
#   （caddy 的自动 HTTPS 更适合有公网域名的场景，本地自签/内网签发反而更绕。）
#
# 安全边界：
#   - 只在 proxy 上监听 80/443；world 的 8020/8030 不发布到公网（compose 仅绑 127.0.0.1）。
#   - HTTP 一律 308 到 HTTPS（308 保留方法与请求体，POST 不会退化成 GET）。
#   - 健康检查路径 /healthz 走明文放行（供容器 HEALTHCHECK 与 LB 探活），
#     其余路径不做例外。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 探活单独放行（不跳转、不写访问日志）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 其余一律跳 HTTPS
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/xkx.crt;
    ssl_certificate_key /etc/nginx/certs/xkx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # 与后端 src/wsim/api/server.py 的 _MAX_BODY_BYTES（8*1024）一致。
    # 后端超限返回 JSON 413 payload_too_large；nginx 在更早一层也会以 413 拒绝，
    # 两者阈值相同，避免"反代放行、后端拒绝"或反之的错位。
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # 后端读超时与 XKX_REQUEST_TIMEOUT（默认 30s）对齐。
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 10s;

    # 透传真实来源；后端按 TCP 对端限流（不读 XFF），反代后限流粒度为 proxy 的地址，
    # 见 docs/OPS-RUNBOOK.md §TLS 的"限流粒度"说明。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";

    # proxy 自身探活
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 后端真实探活：单独放行、不记访问日志（高频探活不污染日志）
    location = /api/health {
        access_log off;
        proxy_pass http://world:8020;
    }

    # API（引擎/鉴权/状态/动作）
    location /api/ {
        proxy_pass http://world:8020;
    }

    # 玩家前端（805/8030 的静态页与同源代理）
    location / {
        proxy_pass http://world:8030;
    }
}
