# W5 一条命令起引擎 + API + 前端（备份默认生效）：
#   cd world-sim/deploy && docker compose up -d --build
#
# - events.sqlite 与 service.sqlite 都在命名卷 xkx-w5-data 的 /app/runs/<RUN_ID>/ 下。
# - 备份容器默认随 `up` 启动，6 小时一轮（BK_INTERVAL 覆盖）；失败时容器 Exited(非零)
#   且 healthcheck 转 unhealthy，状态落在 xkx-w5-backups/last_backup_status.json。
# - 镜像不包含任何密钥；.env 只在运行时作为环境注入（不存在也可启动）。
# - API/UI 默认只绑定 127.0.0.1（不直接暴露公网）；对外走 proxy 的 TLS 端口。

name: xkx

services:
  world:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: xkx/world-sim:w5
    container_name: xkx-world
    # 只绑回环：公网入口只允许经过 proxy（见 deploy/nginx/xkx.conf）。
    # 需要从宿主调试时用 127.0.0.1:8020/8030；这两个端口不会被外部访问。
    ports:
      - "127.0.0.1:${API_PORT:-8020}:8020"
      - "127.0.0.1:${UI_PORT:-8030}:8030"
    expose:
      - "8020"
      - "8030"
    environment:
      RUN_ID: "${RUN_ID:-service}"
      API_PORT: "8020"
      UI_PORT: "8030"
      AUTH_MODE: "${AUTH_MODE:-on}"
      TICK_STEP: "${TICK_STEP:-6}"
      # 与 ./start.sh 一致：默认自走；XKX_AMBIENT=0 关闭。CPU 护栏默认 70%、1x 配速。
      XKX_AMBIENT: "${XKX_AMBIENT:-1}"
      XKX_AMBIENT_CPU: "${XKX_AMBIENT_CPU:-70}"
      XKX_AMBIENT_SPEED: "${XKX_AMBIENT_SPEED:-1}"
      # 注意：XKX_SECRET_KEY 不在这里用 ${...} 显式注入 —— compose 的 environment
      # 优先级高于 env_file，若写成 ${XKX_SECRET_KEY:-} 且宿主/项目 .env 没有该值，
      # 会把 env_file（../.env）里已有的密钥覆盖成空串，导致"密钥看似配了却解不开"。
      # 统一来源：../.env（world 与 admin 共用同一份，见 OPS-RUNBOOK §1.5）。
    # 只读运行时注入：compose 从宿主 .env 读取，不写入镜像；缺失时按 required:false 跳过。
    env_file:
      - path: ../.env
        required: false
    volumes:
      - xkx-data:/app/runs
    restart: unless-stopped
    # 2 小时 soak（50 并发、keep-alive 连接未断）实测 SIGTERM→进程退出 31.24s；
    # 默认 10s 会在 WAL checkpoint/连接收尾前 SIGKILL。45s = 31.24s × 1.44 余量，
    # 覆盖未来数据库变大后的 checkpoint 时间。
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 默认服务（不再用 profile）：备份随 `docker compose up` 一起启动。
  #   - 失败不再吞掉：scripts/backup_loop.sh 重试后仍失败 → Exited(非零) + unhealthy。
  #   - 每轮结果写 /app/backups/last_backup_status.json，供 healthcheck 与运维脚本读取。
  #   - 异地推送：XKX_OFFSITE_MODE / XKX_OFFSITE_TARGET / XKX_OFFSITE_REQUIRED 透传，
  #     未配置时状态文件显式 offsite=disabled（见 tools/backup_offsite.sh）。
  backup:
    image: xkx/world-sim:w5
    container_name: xkx-backup
    # 镜像 ENTRYPOINT 是 deploy/entrypoint.sh（会拉起 API+UI）；compose 的 command
    # 只覆盖 CMD，不覆盖 ENTRYPOINT。必须显式覆盖，否则备份容器会再起一套世界服务，
    # 两个进程同时写同一个 events.sqlite（实测 UNIQUE constraint failed: events.seq）。
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sh /app/scripts/backup_loop.sh"]
    environment:
      RUN_ID: "${RUN_ID:-service}"
      BK_RUN: "${RUN_ID:-service}"
      BK_ROOT: "/app"
      BK_DIR: "/app/backups"
      BK_INTERVAL: "${BK_INTERVAL:-21600}"
      BK_RETRIES: "${BK_RETRIES:-2}"
      BK_RETRY_DELAY: "${BK_RETRY_DELAY:-30}"
      XKX_OFFSITE_MODE: "${XKX_OFFSITE_MODE:-disabled}"
      XKX_OFFSITE_TARGET: "${XKX_OFFSITE_TARGET:-}"
      XKX_OFFSITE_REQUIRED: "${XKX_OFFSITE_REQUIRED:-0}"
      XKX_OFFSITE_SSH_HOST: "${XKX_OFFSITE_SSH_HOST:-}"
      # 备份产物独立卷；不放数据卷里，避免备份撑爆 /app/runs。
      PYTHONPATH: "/app/src"
    volumes:
      - xkx-data:/app/runs
      - xkx-backups:/app/backups
    # 镜像继承的 HEALTHCHECK 检查 8020/8030（该容器没有 API/UI），必须换成备份链路健康检查。
    healthcheck:
      test: ["CMD", "python", "/app/deploy/backup_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # 失败后保持 Exited，由人工/告警介入；避免在坏盘上无限重启刷日志。
    restart: "no"

  # 管理控制台后端（python -m wsim.admin）：默认随栈启动，只挂内网，不映射端口。
  # 与 world 共用 xkx-w5-data 卷和同一份 ../.env（因此共用 XKX_SECRET_KEY /
  # XKX_ADMIN_TOKEN）。反代里的 /admin/ 与 /api/admin/ 是两个独立前缀，玩家入口不受影响。
  admin:
    image: xkx/world-sim:w5
    container_name: xkx-admin
    # 镜像 ENTRYPOINT 是 deploy/entrypoint.sh（会拉起玩家 API+UI），必须覆盖。
    entrypoint: ["python", "-m", "wsim.admin"]
    command: ["--root", "/app", "--run", "${RUN_ID:-service}", "--host", "0.0.0.0", "--port", "8031"]
    environment:
      RUN_ID: "${RUN_ID:-service}"
      XKX_ADMIN_BIND: "0.0.0.0"
      XKX_ADMIN_PORT: "8031"
      # 只信任 proxy 的固定地址（admin-net 静态 IP）；其余来源一律 403。
      XKX_ADMIN_ALLOW_IPS: "172.30.31.10"
      # 生产语义：缺 XKX_SECRET_KEY 时直接 unhealthy，避免"密钥解不开却静默回退 env"。
      XKX_ADMIN_REQUIRE_SECRET: "${XKX_ADMIN_REQUIRE_SECRET:-1}"
      PYTHONPATH: "/app/src"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - xkx-data:/app/runs
    networks:
      - admin-net
    depends_on:
      world:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/deploy/admin_healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 对外唯一入口：TLS 终止、HTTP→HTTPS、X-Forwarded-* 透传。
  # 证书目录 deploy/certs/（gitignore）由 deploy/gen_selfsigned_cert.sh 生成演练证书；
  # 生产替换为运维签发的正式证书，文件名保持 xkx.crt / xkx.key（fullchain 放 .crt），
  # 私钥权限 600，容器只读挂载。任何证书/私钥都不提交、不进镜像。
  # 续期用 ACME HTTP-01 时把 challenge 文件写到 deploy/certs/acme/（只读挂进容器）。
  # 管理面 Basic 凭据由 deploy/gen_admin_basic_auth.sh 生成 admin.htpasswd（同目录）。
  proxy:
    image: nginx:1.27-alpine
    container_name: xkx-proxy
    depends_on:
      world:
        condition: service_healthy
    environment:
      # 公网屏蔽开关：0 = /admin/ 与 /api/admin/ 一律 404。
      ADMIN_ENABLED: "${XKX_ADMIN_PUBLIC:-1}"
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      # 模板必须叫 default.conf.template：渲染结果覆盖镜像自带 default.conf，
      # 避免默认站点抢占 80 端口（否则 Host 不匹配时跳转/healthz 全部落到 404）。
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      # ACME HTTP-01 webroot：certbot 写宿主 deploy/certs/acme/，容器内只读。
      - ./certs/acme:/var/www/certbot:ro
      - ../ui/admin:/usr/share/nginx/admin:ro
    networks:
      default: {}
      admin-net:
        ipv4_address: 172.30.31.10
    restart: unless-stopped
    healthcheck:
      # 80 只做 301（无明文探活），所以探 /healthz 必须走 https；自签证书用
      # --no-check-certificate。后端可用性由 world 的 /api/health 负责。
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # 管理面专用内网：不接外网、不映射端口，只有 proxy 能到 admin。
  admin-net:
    name: xkx-admin-net
    internal: true
    ipam:
      config:
        - subnet: 172.30.31.0/24

volumes:
  xkx-data:
    name: xkx-w5-data
  xkx-backups:
    name: xkx-w5-backups
