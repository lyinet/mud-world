# W5 一条命令起引擎 + API + 前端：
#   cd world-sim/deploy && docker compose up -d --build
#
# - events.sqlite 与 service.sqlite 都在命名卷 xkx-w5-data 的 /app/runs/<RUN_ID>/ 下。
# - 镜像不包含任何密钥；.env 只在运行时作为环境注入（不存在也可启动）。
# - 默认端口 8020（API）、8030（前端）。

name: xkx

services:
  world:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: xkx/world-sim:w5
    container_name: xkx-world
    ports:
      - "${API_PORT:-8020}:8020"
      - "${UI_PORT:-8030}:8030"
    environment:
      RUN_ID: "${RUN_ID:-service}"
      API_PORT: "8020"
      UI_PORT: "8030"
      AUTH_MODE: "${AUTH_MODE:-on}"
      TICK_STEP: "${TICK_STEP:-6}"
      # 与 ./start.sh 一致：默认自走；XKX_AMBIENT=0 关闭。CPU 护栏默认 70%、1x 配速。
      XKX_AMBIENT: "${XKX_AMBIENT:-1}"
      XKX_AMBIENT_CPU: "${XKX_AMBIENT_CPU:-70}"
      XKX_AMBIENT_SPEED: "${XKX_AMBIENT_SPEED:-1}"
    # 只读运行时注入：compose 从宿主 .env 读取，不写入镜像；缺失时按 required:false 跳过。
    env_file:
      - path: ../.env
        required: false
    volumes:
      - xkx-data:/app/runs
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 可选 profile：只做定时在线备份，不提供 API/UI。
  #   cd deploy && docker compose --profile backup up -d
  # 选择 profile 而不是 entrypoint 开关的理由与 RPO/RTO 见 docs/BACKUP-RESTORE.md。
  backup:
    image: xkx/world-sim:w5
    container_name: xkx-backup
    profiles: ["backup"]
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
        python /app/tools/backup_snapshot.py --root /app --run "${RUN_ID:-service}" --backup-dir /app/backups || true;
        sleep "${BK_INTERVAL:-21600}";
        done
    environment:
      RUN_ID: "${RUN_ID:-service}"
      BK_INTERVAL: "${BK_INTERVAL:-21600}"
      # 备份产物独立卷；不放数据卷里，避免备份撑爆 /app/runs。
      PYTHONPATH: "/app/src"
    volumes:
      - xkx-data:/app/runs
      - xkx-backups:/app/backups
    restart: unless-stopped

volumes:
  xkx-data:
    name: xkx-w5-data
  xkx-backups:
    name: xkx-w5-backups
